<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遊戲任務看板</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --ink: #1d1d1f; --muted: #86868b; --line: rgba(0,0,0,.08);
    --col: rgba(0,0,0,.035); --accent: #0071e3; --late: #ff3b30; --soon: #ff9500; --ok: #34c759;
    --glass: rgba(245,245,247,.72); --shadow: 0 2px 6px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --seg: rgba(118,118,128,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --panel: #1c1c1e; --ink: #f5f5f7; --muted: #8e8e93; --line: rgba(255,255,255,.1);
      --col: rgba(255,255,255,.04); --accent: #2997ff; --late: #ff453a; --soon: #ff9f0a; --ok: #30d158;
      --glass: rgba(22,22,23,.72); --shadow: 0 2px 10px rgba(0,0,0,.5); --seg: rgba(118,118,128,.24);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
    font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
    letter-spacing: -.01em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--line); padding: 22px 32px 14px; }
  .top { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
  h1 { font: 700 34px/1.1 -apple-system, "SF Pro Display", "PingFang TC", sans-serif; margin: 0; letter-spacing: -.02em; }
  .hello { color: var(--muted); font-size: 15px; padding-bottom: 4px; }
  .spacer { flex: 1; }
  input[type=search] { border: 0; background: var(--seg); color: var(--ink); border-radius: 10px;
    padding: 8px 12px; width: 240px; max-width: 100%; font: inherit; outline: none; }
  input[type=search]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  button { font: inherit; cursor: pointer; }
  .ghost { border: 0; background: var(--seg); color: var(--accent); border-radius: 980px; padding: 7px 14px; font-weight: 500; }
  .people { display: flex; gap: 2px; flex-wrap: wrap; margin: 16px auto 0; max-width: 1400px;
    background: var(--seg); border-radius: 10px; padding: 2px; width: fit-content; }
  .chip { border: 0; background: transparent; color: var(--ink); border-radius: 8px;
    padding: 6px 14px; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; transition: background .2s; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
  .stats { display: flex; gap: 28px; margin: 14px auto 0; color: var(--muted); font-size: 13px; flex-wrap: wrap; max-width: 1400px; }
  .stats b { color: var(--ink); font-size: 20px; font-weight: 600; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .stats .late b { color: var(--late); }
  .stats .soon b { color: var(--soon); }
  main { padding: 24px 32px 60px; max-width: 1464px; margin: 0 auto; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 20px; align-items: start; }
  .col { background: var(--col); border-radius: 18px; padding: 12px; min-height: 140px; }
  .col h2 { font-size: 13px; font-weight: 600; margin: 4px 6px 12px; display: flex; justify-content: space-between;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
    cursor: pointer; position: relative; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
  .card::before { content: ""; position: absolute; left: 16px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #999); }
  .card:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 4px 12px rgba(0,0,0,.06), 0 16px 32px rgba(0,0,0,.08); }
  .card:active { transform: scale(.98); }
  .card .t { font-weight: 600; font-size: 16px; padding-left: 16px; line-height: 1.3; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
  .tag { border-radius: 980px; padding: 2px 9px; background: var(--seg); color: var(--muted); font-weight: 500; }
  .tag.late { background: color-mix(in srgb, var(--late) 14%, transparent); color: var(--late); }
  .tag.soon { background: color-mix(in srgb, var(--soon) 16%, transparent); color: var(--soon); }
  .col.over { background: color-mix(in srgb, var(--accent) 12%, var(--col)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent); }
  .card { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 22px 0; }
  .more { width: 100%; margin-top: 4px; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .drawer { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(460px, calc(100% - 24px)); background: var(--panel);
    border-radius: 22px; box-shadow: 0 24px 64px rgba(0,0,0,.25); z-index: 11; transform: translateX(calc(100% + 24px));
    transition: transform .4s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 26px; }
  .open .shade { opacity: 1; pointer-events: auto; } .open .drawer { transform: none; }
  .drawer h3 { margin: 0 0 4px; font: 700 24px/1.2 -apple-system, "SF Pro Display", "PingFang TC", sans-serif; letter-spacing: -.02em; }
  .drawer .who { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .group { background: var(--col); border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
  .field { padding: 11px 14px; border-bottom: .5px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field .k { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .field .v { white-space: pre-wrap; word-break: break-word; }
  .field a { color: var(--accent); text-decoration: none; }
  .actions { display: flex; gap: 2px; margin: 4px 0 20px; background: var(--seg); border-radius: 10px; padding: 2px; }
  .actions button { flex: 1; border: 0; background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 4px; font-size: 14px; font-weight: 500; }
  .actions button.cur { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .actions button.cur.done { color: var(--ok); }
  details summary { color: var(--accent); font-size: 14px; cursor: pointer; list-style: none; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--glass); color: var(--ink);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,.18); padding: 10px 18px; border-radius: 980px; display: none; z-index: 20; font-weight: 500; }
  .loading { padding: 80px; text-align: center; color: var(--muted); }
  .login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .login h1 { font-size: 40px; }
  .login p { color: var(--muted); margin: 0; }
  .app[hidden], .login[hidden] { display: none; }
  .tvwrap { position: fixed; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    opacity: 0; pointer-events: none; transition: opacity .3s; padding: 16px; }
  .tvopen .tvwrap { opacity: 1; pointer-events: auto; } .tvopen .shade { opacity: 1; pointer-events: auto; }
  .tv { position: relative; width: min(560px, 92vw, 70vh); aspect-ratio: 1; }
  .tv::after { content: ""; position: absolute; inset: 0; background: url(tv_black.png) center/100% no-repeat; pointer-events: none; z-index: 1; }
  .tv iframe, .tv .noep { position: absolute; left: 4.5%; top: 4%; width: 91%; height: 75.8%; border: 0; background: #000; }
  .tv .noep { display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; }
  .eps { display: flex; gap: 2px; background: var(--seg); border-radius: 10px; padding: 2px; }
  .eps button { border: 0; background: transparent; color: var(--ink); border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
  .eps button.cur { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tvwrap .ghost { background: var(--panel); }
  .login .must { color: var(--ink); background: var(--seg); border-radius: 12px; padding: 12px 16px; max-width: 420px; font-size: 14px; line-height: 1.6; }
  @media (max-width: 900px) {
    header { padding: 16px 16px 12px; } main { padding: 16px 16px 40px; }
    h1 { font-size: 28px; }
    .board { grid-template-columns: 1fr; }
    input[type=search] { width: 100%; }
    .people { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  }

  /* ===== 復古麥金塔風（彩虹蘋果年代）：淺色＝白金灰、深色＝黑 ===== */
  :root {
    --bg: #a9a9b8; --panel: #ffffff; --ink: #000000; --muted: #555555; --line: #000000;
    --col: #dddddd; --accent: #000000; --seg: #ffffff; --glass: #ffffff;
    --win: #ffffff; --stripe: #000000; --desk: #b8b8c8; --desk2: #9c9cb0; --hard: 2px 2px 0 #000;
    --shadow: 1px 1px 0 #000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --panel: #111111; --ink: #f2f2f2; --muted: #9a9a9a; --line: #f2f2f2;
      --col: #1c1c1c; --accent: #f2f2f2; --seg: #000000; --glass: #000000;
      --win: #111111; --stripe: #f2f2f2; --desk: #0b0b0b; --desk2: #1d1d1d; --hard: 2px 2px 0 #f2f2f2;
      --shadow: 1px 1px 0 #f2f2f2;
    }
  }
  body { font-family: "Chicago", "Geneva", "Monaco", "PingFang TC", "Noto Sans TC", sans-serif; letter-spacing: 0;
    background-color: var(--desk); -webkit-font-smoothing: none;
    background-image: repeating-conic-gradient(var(--desk2) 0 25%, transparent 0 50%); background-size: 4px 4px; }
  h1, .login h1 { font-family: inherit; font-weight: 700; letter-spacing: 0; display: inline-flex; align-items: center; gap: 12px; }
  h1::before { content: ""; width: 22px; height: 26px; flex: none; border: 1.5px solid var(--ink);
    background: linear-gradient(#61bb46 0 17%, #fdb827 17% 33%, #f5821f 33% 50%, #e03a3e 50% 67%, #963d97 67% 83%, #009ddc 83%); }
  header { background: var(--win); -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom: 2px solid var(--ink); }
  input[type=search] { border: 1.5px solid var(--ink); border-radius: 0; background: var(--panel); }
  input[type=search]:focus { box-shadow: var(--hard); }
  .ghost, .more, .tvwrap .ghost { background: var(--panel); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 7px;
    box-shadow: var(--shadow); font-weight: 700; }
  .ghost:active { background: var(--ink); color: var(--panel); }
  .people, .actions, .eps { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 0; padding: 0; gap: 0; box-shadow: var(--hard); }
  .chip, .actions button, .eps button { border-radius: 0; border-right: 1.5px solid var(--ink); white-space: nowrap; flex: none; }
  .chip:last-child, .actions button:last-child, .eps button:last-child { border-right: 0; }
  .chip.on, .actions button.cur, .eps button.cur { background: var(--ink); color: var(--panel); box-shadow: none; }
  .chip.on .n { color: var(--panel); }
  .actions button.cur.done { color: #61bb46; }
  .stats { color: var(--ink); }
  .stats b { font-variant-numeric: tabular-nums; }
  .col { background: var(--win); border: 1.5px solid var(--ink); border-radius: 0; box-shadow: var(--hard); padding: 0 10px 10px; }
  .col h2 { margin: 0 -10px 12px; padding: 5px 10px; color: var(--ink); letter-spacing: 0; font-size: 14px; text-transform: none;
    border-bottom: 1.5px solid var(--ink);
    background: linear-gradient(var(--win), var(--win)) center/calc(100% - 0px) 0 no-repeat,
      repeating-linear-gradient(var(--stripe) 0 1px, transparent 1px 3px) 0 4px/100% calc(100% - 8px) no-repeat; }
  .col h2 span { background: var(--win); padding: 0 8px; }
  .col.over { background: var(--col); box-shadow: var(--hard), inset 0 0 0 3px var(--ink); }
  .card { border: 1.5px solid var(--ink); border-radius: 4px; box-shadow: var(--shadow); }
  .card:hover { transform: none; box-shadow: var(--hard); }
  .card:active { transform: translate(1px, 1px); }
  .card::before { border: 1px solid var(--ink); border-radius: 0; }
  .tag { border-radius: 0; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); }
  .tag.late { background: #e03a3e; color: #fff; border-color: #e03a3e; }
  .tag.soon { background: #fdb827; color: #000; border-color: #000; }
  .stats .late b { color: #e03a3e; } .stats .soon b { color: #f5821f; }
  .shade { background: rgba(0,0,0,.25); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .drawer { border: 1.5px solid var(--ink); border-radius: 0; box-shadow: 4px 4px 0 var(--ink); top: 24px; right: 24px; bottom: 24px; }
  .drawer h3 { font-family: inherit; letter-spacing: 0; }
  .group { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 0; }
  .field { border-bottom: 1px solid var(--ink); }
  details summary, .field a { color: var(--ink); text-decoration: underline; }
  .toast { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 0; box-shadow: var(--hard); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .login { gap: 22px; }
  .login > * { position: relative; }
  .login .must { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 0; box-shadow: var(--hard); color: var(--ink); }
  .login p { color: var(--ink); }
  .loading { color: var(--ink); }
</style>
</head>
<body>
<section class="login" id="login">
  <h1>遊戲任務看板</h1>
  <p class="must"><b>一定要用歐米爾公司信箱（@offerme2.com）登入</b><br>私人 Gmail 會被擋在外面。<br>如果瀏覽器同時登了好幾個 Google 帳號，請在選帳號時選公司的那一個。</p>
  <div id="gbtn"></div>
  <p id="loginMsg" style="color:var(--late)"></p>
</section>
<div class="app" id="app" hidden>
<header>
  <div class="top">
    <h1>遊戲任務看板</h1>
    <span class="hello" id="hello"></span>
    <span class="spacer"></span>
    <a class="ghost" href="gantt.html" style="text-decoration:none">📅 甘特圖</a>
    <button class="ghost" id="howto">📺 使用說明</button>
    <button class="ghost" id="logout">登出</button>
    <input type="search" id="q" placeholder="搜尋客戶、類型、備註…">
    <button class="ghost" id="reload" title="重新整理">更新 <span id="at"></span></button>
  </div>
  <div class="people" id="people"></div>
  <div class="stats" id="stats"></div>
</header>
<main><div class="loading" id="board">載入中…</div></main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div class="tvwrap" id="tvwrap">
  <div class="eps" id="eps"></div>
  <div class="tv" id="tv"></div>
  <button class="ghost" id="tvclose">關閉</button>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 設定 =====
const CLIENT_ID = '640400742388-6l54t8snipni2idi4125kmk5pjvaki76.apps.googleusercontent.com';
const API_URL = 'https://script.google.com/macros/s/AKfycbz1RDARfY94PHB3gZFwCx-GvxNYlBxk9T-dZJUxFmAbYNphZ3xdWU9xzNucqnZodnbE/exec';
// ================
let TOKEN = null;
try { TOKEN = sessionStorage.getItem('idToken'); } catch (e) {}
let DATA = null, WHO = 'ALL', SHOW_ALL_DONE = false;
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const DONE = '✅ 已完成';
const COL_NAMES = { '待處理': '待處理', '進行中': '進行中', '待審': '待審', [DONE]: '已完成' };

function load() {
  $('at').textContent = '…';
  clearTimeout(load.slow);
  load.slow = setTimeout(() => { if (!DATA) showError('等太久了，按右上角「更新」再試一次'); }, 25000);
  api({ action: 'board' }).then(render, fail);
}
// GAS 用 text/plain 收 JSON，避免跨網域預檢
async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token: TOKEN }) });
  const out = await res.json();
  if (!out.ok) {
    if (/登入|過期|來源|只限/.test(out.error)) { signOut(out.error); throw new Error(out.error); }
    throw new Error(out.error);
  }
  return out.data;
}
function onSignIn(resp) {
  TOKEN = resp.credential;
  try { sessionStorage.setItem('idToken', TOKEN); } catch (e) {}
  $('login').hidden = true; $('app').hidden = false;
  load();
}
function signOut(msg) {
  TOKEN = null; DATA = null;
  try { sessionStorage.removeItem('idToken'); } catch (e) {}
  $('app').hidden = true; $('login').hidden = false;
  $('loginMsg').textContent = msg || '';
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
}
function initLogin() {
  if (!window.google || !google.accounts) return setTimeout(initLogin, 100);
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onSignIn, hd: 'offerme2.com', auto_select: true, ux_mode: 'popup' });
  google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'zh-TW' });
  if (!TOKEN) google.accounts.id.prompt();
}
function fail(e) { if (!TOKEN) return; showError(e && e.message || e); $('at').textContent = ''; }
function showError(msg) { $('board').className = 'loading'; $('board').textContent = '出錯了：' + msg; }
window.onerror = (msg, src, line) => showError(msg + '（第 ' + line + ' 行）');
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

// 交期：抓第一個日期（2026/10/15、10/15、8/12第一批…），沒有年份就當今年
function dueDate(s) {
  const m = String(s || '').match(/(?:(\d{4})[\/\-.])?(\d{1,2})[\/\-.](\d{1,2})/);
  if (!m) return null;
  const now = new Date();
  const d = new Date(m[1] ? +m[1] : now.getFullYear(), +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}
function dueInfo(t) {
  if (t['狀態'] === DONE) return null;
  const d = dueDate(t['交期']);
  if (!d) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 864e5);
  if (days < 0) return { cls: 'late', text: `逾期 ${-days} 天` };
  if (days === 0) return { cls: 'late', text: '今天到期' };
  if (days <= 3) return { cls: 'soon', text: `${days} 天後到期` };
  return null;
}
function title(t) { return t['客戶'] || (t['備註'] || t['原始訊息'] || '').split('\n')[0].slice(0, 40) || '(未命名)'; }
function color(code) { return (DATA.members.find(m => m.code === code) || {}).color || '#999'; }

function render(data) {
  if (!data) return showError('後台沒有回傳資料');
  DATA = data;
  if (WHO === 'ALL' && data.me && !render.once) WHO = data.me;
  render.once = true;
  $('hello').textContent = data.me ? `嗨 ${data.me}` : (data.email ? data.email : '');
  $('at').textContent = data.loadedAt + '・' + data.tasks.length + ' 筆';
  draw();
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  return DATA.tasks.filter(t => (WHO === 'ALL' || t.code === WHO) &&
    (!q || ['客戶', '案件類型', '備註', '原始訊息', '編號', '發起人'].some(k => String(t[k]).toLowerCase().includes(q))));
}

function draw() {
  const open = DATA.tasks.filter(t => t['狀態'] !== DONE);
  $('people').innerHTML = [{ code: 'ALL', color: 'transparent' }].concat(DATA.members).map(m => {
    const n = m.code === 'ALL' ? open.length : open.filter(t => t.code === m.code).length;
    const label = m.code === 'ALL' ? '全部' : m.code === 'other' ? '未指派' : m.code;
    return `<button class="chip ${WHO === m.code ? 'on' : ''}" data-who="${m.code}">
      ${m.code === 'ALL' ? '' : `<span class="dot" style="background:${m.color}"></span>`}${label}<span class="n">${n}</span></button>`;
  }).join('');

  const tasks = visible();
  const mine = tasks.filter(t => t['狀態'] !== DONE);
  const late = mine.filter(t => (dueInfo(t) || {}).cls === 'late').length;
  const soon = mine.filter(t => (dueInfo(t) || {}).cls === 'soon').length;
  $('stats').innerHTML = `<span>未完成 <b>${mine.length}</b></span><span class="late">逾期／今天 <b>${late}</b></span><span class="soon">3 天內到期 <b>${soon}</b></span>`;

  const since = Date.now() - 14 * 864e5;
  $('board').className = 'board';
  $('board').innerHTML = DATA.statuses.map(st => {
    let list = tasks.filter(t => t['狀態'] === st || (st === '待處理' && !DATA.statuses.includes(t['狀態'])));
    if (st === DONE) {
      list.sort((a, b) => String(b['完成時間']).localeCompare(String(a['完成時間'])));
      if (!SHOW_ALL_DONE) list = list.filter(t => { const d = new Date(String(t['完成時間']).replace(/\//g, '-')); return isNaN(d) || d >= since; });
    } else {
      list.sort((a, b) => (dueDate(a['交期']) || 9e15) - (dueDate(b['交期']) || 9e15));
    }
    const cards = list.map(t => {
      const due = dueInfo(t);
      return `<div class="card" style="--c:${color(t.code)}" data-k="${t.code}|${t.row}">
        <div class="t">${esc(title(t))}</div>
        <div class="sub">${esc([t['案件類型'], t['張數'] && (String(t['張數']).match(/張/) ? t['張數'] : t['張數'] + ' 張')].filter(Boolean).join('・'))}</div>
        <div class="meta">
          ${t.pending ? '<span class="tag late">待派工</span>' : ''}
          ${due ? `<span class="tag ${due.cls}">${due.text}</span>` : ''}
          ${t['交期'] ? `<span class="tag">交期 ${esc(t['交期'])}</span>` : ''}
          ${WHO === 'ALL' ? `<span class="tag">${t.code === 'other' ? '未指派' : t.code}</span>` : ''}
          <span class="tag">#${esc(t['編號'])}</span>
        </div></div>`;
    }).join('') || '<div class="empty">沒有</div>';
    const more = st === DONE ? `<button class="ghost more" id="moreDone">${SHOW_ALL_DONE ? '只看近 14 天' : '看全部已完成'}</button>` : '';
    return `<section class="col" data-col="${st}"><h2><span>${COL_NAMES[st]}</span><span>${list.length}</span></h2>${cards}${more}</section>`;
  }).join('');
}

function openCard(key) {
  const t = DATA.tasks.find(x => `${x.code}|${x.row}` === key);
  if (!t) return;
  // 規格以下不拆欄位：直接顯示原始訊息裡「客戶／類型／張數／交期」以外的內容（Karen 2026-10-11）
  const row = (k, v) => v ? `<div class="field"><div class="k">${k}</div><div class="v">${linkify(v)}</div></div>` : '';
  const fields = ['案件類型', '張數', '交期'].map(k => row(k, t[k])).join('') + row('需求內容', detailText(t))
    + ['發起人', '派工時間', '完成時間'].map(k => row(k, t[k])).join('');
  $('drawer').innerHTML = `
    <button class="ghost" id="close" style="float:right">關閉</button>
    <h3>${esc(title(t))}</h3>
    <div class="who">#${esc(t['編號'])}・${t.code === 'other' ? '未指派' : t.code}</div>
    ${t.pending ? `<div class="must" style="margin:10px 0;padding:10px 12px;border:1.5px solid var(--ink)">還沒派工。請在群組打：<b>派 ${esc(t['編號'])} @設計師</b></div>` : ''}
    <div class="actions" ${t.pending ? 'hidden' : ''}>${DATA.statuses.map(s => `<button data-st="${s}" class="${t['狀態'] === s ? 'cur' : ''} ${s === DONE ? 'done' : ''}">${COL_NAMES[s]}</button>`).join('')}</div>
    <div class="group">${fields}</div>
    <details><summary>顯示原始訊息</summary><div class="v" style="margin-top:6px">${linkify(t['原始訊息'])}</div></details>`;
  $('drawer').dataset.k = key;
  document.body.classList.add('open');
}
function detailText(t) {
  const HEAD = /^\s*(客戶|案件類型|類型|專案|需求張數|張數|需求時間|截止時間|交期|發起人|需求人|申請人)\s*[：:]/;
  const lines = String(t['原始訊息'] || '').split(/\n/)
    .map(l => l.replace(/^\s*(@\S+\s*)+/, '').replace(/^\s*[+＋]\s*新規\s*/, '').replace(/^\s*潤稿\s*/, ''))
    .filter(l => l.trim() && !HEAD.test(l));
  if (lines.length) return lines.join('\n').trim();
  return ['規格', '素材位置', '簡報路徑', '備註'].map(k => t[k]).filter(Boolean).join('\n');
}
function closeCard() { document.body.classList.remove('open'); }

function setStatus(st) {
  const t = DATA.tasks.find(x => `${x.code}|${x.row}` === $('drawer').dataset.k);
  if (t) { closeCard(); changeStatus(t, st); }
}
// 先在畫面上移過去，背景再寫進試算表；失敗就移回來
function changeStatus(t, st) {
  if (!t || t.pending || t['狀態'] === st) return;
  const before = t['狀態'];
  t['狀態'] = st; draw();
  toast(`#${t['編號']} → ${COL_NAMES[st]}`);
  api({ action: 'status', code: t.code, row: t.row, no: t['編號'], status: st })
    .then(render, e => { t['狀態'] = before; draw(); toast('沒改成功：' + e.message); });
}

// ===== 拖曳卡片換欄：滑鼠直接拖；手機長按一下再拖 =====
let drag = null;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card');
  if (!card || e.button > 0) return;
  if (card.dataset.k.indexOf('|P') > 0) return; // 待派工的單不能拖
  drag = { card, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, touch: e.pointerType !== 'mouse' };
  if (drag.touch) drag.timer = setTimeout(() => drag && startDrag(e.clientX, e.clientY), 350);
});
function startDrag(x, y) {
  drag.on = true;
  const r = drag.card.getBoundingClientRect();
  drag.dx = x - r.left; drag.dy = y - r.top;
  drag.ghost = drag.card.cloneNode(true);
  Object.assign(drag.ghost.style, { position: 'fixed', width: r.width + 'px', left: r.left + 'px', top: r.top + 'px',
    zIndex: 30, pointerEvents: 'none', transform: 'rotate(2deg) scale(1.03)', boxShadow: '0 20px 40px rgba(0,0,0,.2)' });
  document.body.appendChild(drag.ghost);
  drag.card.style.opacity = '.35';
  document.body.style.userSelect = 'none';
  if (navigator.vibrate) navigator.vibrate(10);
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const far = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6;
  if (!drag.on) {
    if (drag.touch) { if (far) { clearTimeout(drag.timer); drag = null; } return; } // 手機沒長按就是在捲動
    if (!far) return;
    startDrag(e.clientX, e.clientY);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX - drag.dx + 'px';
  drag.ghost.style.top = e.clientY - drag.dy + 'px';
  document.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('.col');
  if (col) col.classList.add('over');
}, { passive: false });
document.addEventListener('touchmove', e => { if (drag && drag.on) e.preventDefault(); }, { passive: false });
function endDrag(e) {
  if (!drag) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  if (!d.on) return;
  d.ghost.remove(); d.card.style.opacity = ''; document.body.style.userSelect = '';
  document.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
  d.justDragged = true; endDrag.last = Date.now();
  const col = e && document.elementFromPoint(e.clientX, e.clientY)?.closest('.col');
  const t = DATA.tasks.find(x => `${x.code}|${x.row}` === d.card.dataset.k);
  if (col && t) changeStatus(t, col.dataset.col);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => endDrag(null));

// ===== 使用說明影片（放在公司共用雲端硬碟 offerme2_Design/特助狗使用說明，只有公司帳號看得到）=====
const EPISODES = [
  { name: 'EP1 開需求單', drive: '1f294SurChd0EPgv-H3IXYv9eRuBqtJEy' },
  { name: 'EP2 不准打斷設計師', drive: '10EyCIKDB_TagK6zKxu_35z2Dhz2n8BSU' },
];
let EP = 0;
function showEp(i) {
  EP = i;
  $('eps').innerHTML = EPISODES.map((e, j) => `<button data-ep="${j}" class="${j === i ? 'cur' : ''}">${esc(e.name)}</button>`).join('');
  const id = EPISODES[i].drive;
  $('tv').innerHTML = id ? `<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
    : '<div class="noep">影片準備中…</div>';
}
function openTv() { showEp(EP); document.body.classList.add('tvopen'); }
function closeTv() { document.body.classList.remove('tvopen'); $('tv').innerHTML = ''; }

document.addEventListener('click', e => {
  if (e.target.id === 'howto') return openTv();
  if (e.target.id === 'tvclose' || (e.target.id === 'shade' && document.body.classList.contains('tvopen'))) return closeTv();
  const ep = e.target.closest('[data-ep]'); if (ep) return showEp(+ep.dataset.ep);
  const chip = e.target.closest('.chip'); if (chip) { WHO = chip.dataset.who; return draw(); }
  const card = e.target.closest('.card'); if (card) { if (Date.now() - (endDrag.last || 0) < 300) return; return openCard(card.dataset.k); }
  const st = e.target.closest('[data-st]'); if (st) return setStatus(st.dataset.st);
  if (e.target.id === 'close' || e.target.id === 'shade') return closeCard();
  if (e.target.id === 'moreDone') { SHOW_ALL_DONE = !SHOW_ALL_DONE; return draw(); }
  if (e.target.closest('#reload')) return load();
  if (e.target.id === 'logout') return signOut();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCard(); closeTv(); } });
$('q').addEventListener('input', () => DATA && draw());
setInterval(() => TOKEN && document.visibilityState === 'visible' && load(), 2 * 60 * 1000);
initLogin();
if (TOKEN) { $('login').hidden = true; $('app').hidden = false; load(); }
</script>
